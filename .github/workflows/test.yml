name: Forge Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

jobs:
  test:
    strategy:
      fail-fast: true

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Run Forge tests
        env:
          ALCHEMY_APIKEY: ${{secrets.ALCHEMY_APIKEY}}
          MAINNET_RPC_URL: ${{secrets.MAINNET_RPC_URL}}
          OPTIMISM_RPC_URL: ${{secrets.OPTIMISM_RPC_URL}}
          ARBITRUM_ONE_RPC_URL: ${{secrets.ARBITRUM_ONE_RPC_URL}}
          ARBITRUM_NOVA_RPC_URL: ${{secrets.ARBITRUM_NOVA_RPC_URL}}
          GNOSIS_CHAIN_RPC_URL: ${{secrets.GNOSIS_CHAIN_RPC_URL}}
          BASE_RPC_URL: ${{secrets.BASE_RPC_URL}}
          GOERLI_RPC_URL: ${{secrets.GOERLI_RPC_URL}}
          UNICHAIN_RPC_URL: ${{secrets.UNICHAIN_RPC_URL}}
          RH_RPC_URL: ${{secrets.RH_RPC_URL}}
          ETHERSCAN_API_KEY: ${{secrets.ETHERSCAN_API_KEY}}
        run: |
          forge test -vvv
        id: test

  # --- Spell Caster, patched copy for this draft PR only -----------------------------------
  # Runs as its own job, in parallel with the tests, so the simulation links show up within a
  # few minutes regardless of the test outcome.
  #
  # The upstream step (marsfoundation/spell-caster@action) cannot execute Gnosis spells: it
  # reads SUBMISSION_ROLE() on the executor, but the Gnosis executor is the legacy AMB bridge
  # executor and reverts. So instead of the action we check out spell-caster, drop in
  # .github/spell-caster/castSpell.ts (same flow, Gnosis executed via impersonated
  # executeDelegateCall like the forge harness does) and run it as a CLI.
  spell-caster:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Checkout spell-caster
        uses: actions/checkout@v4
        with:
          repository: marsfoundation/spell-caster
          ref: main
          path: .spell-caster

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Spell Caster (patched for Gnosis)
        working-directory: .spell-caster
        env:
          TENDERLY_API_KEY: ${{ secrets.TENDERLY_ACCESS_KEY }}
          TENDERLY_PROJECT: ${{ secrets.TENDERLY_PROJECT }}
          TENDERLY_ACCOUNT: ${{ secrets.TENDERLY_USER }}
        run: |
          bun install --frozen-lockfile
          cp "$GITHUB_WORKSPACE/.github/spell-caster/castSpell.ts" src/bin/castSpell.ts
          bun src/bin/castSpell.ts \
            --root "$GITHUB_WORKSPACE" \
            --out "$GITHUB_WORKSPACE/spell-caster-results.json" \
            SparkEthereum_20260910 SparkGnosis_20260910

      - name: Post Spell Caster comment
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f spell-caster-results.json ]; then
            echo "No spell-caster results to post"
            exit 0
          fi
          {
            echo "## Spell Caster (patched run from this PR)"
            echo
            echo "Inspect the impact of spell execution on forked networks:"
            echo
            echo "| Spell | App URL | RPC URL |"
            echo "| --- | --- | --- |"
            jq -r '.results[]  | "| \(.spellName) | [🎇 App](\(.appUrl)) | [🌎 RPC](\(.forkRpc)) |"' spell-caster-results.json
            jq -r '.failures[] | "| \(.spellName) | ❌ failed | `\(.error | gsub("[\\n\\r|]"; " ") | .[0:200])` |"' spell-caster-results.json
            echo
            echo "<sub>Deployed from ${HEAD_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ)</sub>"
          } > spell-caster-comment.md
          cat spell-caster-comment.md
          gh pr comment "$PR_NUMBER" --body-file spell-caster-comment.md
